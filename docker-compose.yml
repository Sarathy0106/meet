version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sidaz_meet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sarathyv
      POSTGRES_PASSWORD: sushmidha
      POSTGRES_DB: meet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarathyv -d meet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
